configure(allProject) {
    apply plugin: 'maven-publish'
    apply plugin: 'signing'
    apply plugin: 'com.github.johnrengelman.shadow'

    description = 'D4M All – bundled jar of d4m-common, d4m-kv, and d4m-sequence'

    dependencies {
        api commonProject
        api kvProject
        api sequenceProject
    }

    shadowJar {
        archiveBaseName = jar.archiveBaseName
        archiveAppendix = jar.archiveAppendix
        archiveClassifier = ''
        manifest.attributes(
                'Implementation-Title': projectName,
                'Implementation-Version': projectVersion,
                'Implementation-Vendor': projectAuthor,
                'Automatic-Module-Name': 'io.github.green4j.d4m.all')

        dependencies {
            include(project(commonProject.path))
            include(project(kvProject.path))
            include(project(sequenceProject.path))
        }
    }

    jar.finalizedBy shadowJar

    sourcesJar {
        from files(
                commonProject.sourceSets.main.allSource,
                kvProject.sourceSets.main.allSource,
                sequenceProject.sourceSets.main.allSource
        )
    }

    javadoc {
        source += commonProject.sourceSets.main.allJava
        source += kvProject.sourceSets.main.allJava
        source += sequenceProject.sourceSets.main.allJava
    }

    publishing {
        publications {
            d4mAll(MavenPublication) {
                //artifactId = project.name
                artifact shadowJar
                artifact sourcesJar
                artifact javadocJar
                pom(projectPom)
                pom.withXml {
                    if (project.description) {
                        asNode().appendNode('description', project.description)
                    }
                }
                addDepsFromProjects(pom, [commonProject, kvProject, sequenceProject])
            }
        }

        repositories {
            maven {
                name = 'MavenCentral'
                url = sonatypeReleasesRepoUrl
                credentials {
                    username = sonatypeUsername
                    password = sonatypePassword
                }
            }
        }
    }

    signing {
        if (signingKey) {
            useInMemoryPgpKeys(signingKey, signingPassword)
        }
        sign publishing.publications.d4mAll
    }
}

configure(benchmarkJmhProject) {
    description = 'D4M JMH benchmarks'

    dependencies {
        implementation kvProject
        implementation sequenceProject

        implementation "org.openjdk.jmh:jmh-core:${jmhVersion}"
        annotationProcessor "org.openjdk.jmh:jmh-generator-annprocess:${jmhVersion}"
    }

    tasks.register('jmh', JavaExec) {
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'org.openjdk.jmh.Main'
        jvmArgs '--add-opens', 'java.base/jdk.internal.misc=ALL-UNNAMED',
                '--add-opens', 'java.base/java.nio=ALL-UNNAMED'
        def jmhArgsProp = project.findProperty('jmhArgs')
        if (jmhArgsProp) {
            args jmhArgsProp.split(' ').toList()
        }
        dependsOn classes
    }
}

configure(exampleProject) {
    description = 'D4M usage examples'

    dependencies {
        implementation kvProject
        implementation sequenceProject
        implementation "org.hdrhistogram:HdrHistogram:${hdrhistogramVersion}"
    }

    // Run any example main class, e.g.:
    //   ./gradlew :d4m-example:runExample \
    //       -Pmain=io.github.green4j.d4m.example.kv.TieredKeyValueStorageUsage \
    //       -Dd4m.kv.count=1000000
    // Any -Dd4m.* system properties on the Gradle invocation are forwarded.
    tasks.register('runExample', JavaExec) {
        group = 'application'
        description = 'Runs a d4m-example main class specified via -Pmain'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = providers.gradleProperty('main').orElse('')
        jvmArgs '--add-opens', 'java.base/jdk.internal.misc=ALL-UNNAMED',
                '--add-opens', 'java.base/java.nio=ALL-UNNAMED'
        System.getProperties().stringPropertyNames().findAll { it.startsWith('d4m.') }.each {
            systemProperty it, System.getProperty(it)
        }
        doFirst {
            if (mainClass.get().isEmpty()) {
                throw new GradleException(
                        "Specify the main class with -Pmain=<fully.qualified.ClassName>")
            }
        }
    }
}

tasks.register('uploadArtifactsToSonatypeCentralPortal', SonatypeCentralPortalUploadRepositoryTask) {
    portalUsername.set(sonatypeUsername)
    portalPassword.set(sonatypePassword)
    groupId.set(projectGroup)
    snapshotRelease.set(!isRelease)
}

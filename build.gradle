plugins {
    id 'com.github.johnrengelman.shadow' version '7.1.2' apply false
}

defaultTasks 'clean', 'build'

def projectVersion = file('version.txt').text.trim()

def getConfigProperty(final String propertyName) {
    String value = project.findProperty(propertyName)
    if (!value) {
        value = System.getenv(propertyName)
        if (!value) {
            return null
        }
    }
    return value.trim()
}

def addDepsFromProjects(pom, projects) {
    pom.withXml {
        def depsNode = asNode().appendNode('dependencies')
        def addedDeps = [] as Set

        projects.each { proj ->
            // api -> compile scope
            proj.configurations.api.allDependencies.each { dep ->
                if (dep instanceof ExternalModuleDependency
                        && addedDeps.add("${dep.group}:${dep.name}")) {
                    def node = depsNode.appendNode('dependency')
                    node.appendNode('groupId', dep.group)
                    node.appendNode('artifactId', dep.name)
                    node.appendNode('version', dep.version)
                    node.appendNode('scope', 'compile')
                }
            }

            // implementation -> runtime scope
            proj.configurations.implementation.allDependencies.each { dep ->
                if (dep instanceof ExternalModuleDependency
                        && addedDeps.add("${dep.group}:${dep.name}")) {
                    def node = depsNode.appendNode('dependency')
                    node.appendNode('groupId', dep.group)
                    node.appendNode('artifactId', dep.name)
                    node.appendNode('version', dep.version)
                    node.appendNode('scope', 'runtime')
                }
            }
        }
    }
}

ext {
    d4mSrcJavaVersion = JavaVersion.toVersion(srcJavaVersion)

    isRelease = !projectVersion.endsWith('-SNAPSHOT')

    sonatypeReleasesRepoUrl = isRelease
            ? 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
            : 'https://central.sonatype.com/repository/maven-snapshots/'

    sonatypeUsername = getConfigProperty('SONATYPE_USERNAME')
    sonatypePassword = getConfigProperty('SONATYPE_PASSWORD')

    signingKey = getConfigProperty('SIGNING_GPG_SECRET_KEY')    // ascii-armored secret key
    signingPassword = getConfigProperty('SIGNING_GPG_PASSWORD') // plain text
}

def projectPom = {
    name = projectName
    // artifactId can be defined here optionally
    url = 'https://github.com/green4j/d4m'

    scm {
        connection = 'scm:git:https://github.com/green4j/d4m.git'
        developerConnection = 'scm:git:https://github.com/green4j/d4m.git'
        url = 'https://github.com/green4j/d4m.git'
    }

    licenses {
        license {
            name = 'MIT License'
            url = 'https://opensource.org/licenses/MIT'
        }
    }

    developers {
        developer {
            id = 'anatolygudkov'
            name = 'Anatoly Gudkov'
            email = 'gudkovanatoly@hotmail.com'
            url = 'https://github.com/anatolygudkov'
        }
    }
}

def commonProject = project(':d4m-common')
def kvProject = project(':d4m-kv')
def sequenceProject = project(':d4m-sequence')
def allProject = project(':d4m-all')
def benchmarkJmhProject = project(':d4m-benchmark:jmh')
def exampleProject = project(':d4m-example')

configure([commonProject,
           kvProject,
           sequenceProject,
           allProject,
           benchmarkJmhProject,
           exampleProject]) {
    apply plugin: 'java-library'
    apply plugin: 'checkstyle'

    group = projectGroup
    version = projectVersion

    repositories {
        mavenLocal()
        mavenCentral()
    }

    dependencies {
        checkstyle "com.puppycrawl.tools:checkstyle:${checkstyleVersion}"
    }

    java {
        withSourcesJar()
        withJavadocJar()

        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    compileJava {
        options.compilerArgs.addAll([
                '--add-exports', 'java.base/jdk.internal.misc=ALL-UNNAMED',
                '-Xlint:all', '-Werror'
        ]) // enable all warnings and treat them as errors
        options.encoding = 'UTF-8'
        options.deprecation = true
    }

    javadoc {
        failOnError = false

        title = "<h1>${projectName}</h1>"
        options.bottom = "<i>Copyright &#169; 2024-2026 ${projectAuthor} and others. All Rights Reserved.</i>"
        options.encoding = 'UTF-8'
        options.docEncoding = 'UTF-8'
        options.charSet = 'UTF-8'
        if (JavaVersion.current().isJava10Compatible()) {
            options.addBooleanOption 'html5', true
        }
        options.addStringOption('Xdoclint:all,-missing', '-quiet')
        options.addStringOption('-add-exports', 'java.base/jdk.internal.misc=ALL-UNNAMED')
    }

    jar {
        manifest {
            attributes 'Implementation-Title': projectName,
                    'Implementation-Version': projectVersion,
                    'Implementation-Vendor': projectAuthor
        }
        includeEmptyDirs = false
    }

    checkstyle {
        toolVersion = "${checkstyleVersion}"
    }

    tasks.withType(Sign).configureEach {
        onlyIf {
            isRelease && gradle.taskGraph.hasTask(tasks.publish)
        }
    }
}

configure([commonProject,
           kvProject,
           sequenceProject]) {
    apply plugin: 'jacoco'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    dependencies {
        testImplementation "org.junit.jupiter:junit-jupiter:${jupiterVersion}"
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()

        jvmArgs '--add-opens', 'java.base/jdk.internal.misc=ALL-UNNAMED',
                '--add-opens', 'java.base/java.nio=ALL-UNNAMED'

        testLogging {
            events 'skipped', 'failed'
            showStandardStreams = true
            exceptionFormat = 'full'
            afterSuite { desc, result ->
                if (!desc.parent) {
                    println "Results: ${result.resultType} (${result.testCount} tests, " +
                            "${result.successfulTestCount} successes, " +
                            "${result.failedTestCount} failures, " +
                            "${result.skippedTestCount} skipped)"
                }
            }
        }
    }

    check {
        dependsOn jacocoTestReport
    }
}

configure(commonProject) {
    description = 'D4M Common – shared primitives (AtomicBuffer, UnsafeBuffer, bit/byte utilities)'

    publishing {
        publications {
            d4mCommon(MavenPublication) {
                from components.java
                pom(projectPom)
                pom.withXml {
                    if (project.description) {
                        asNode().appendNode('description', project.description)
                    }
                }
            }
        }

        repositories {
            maven {
                name = 'MavenCentral'
                url = sonatypeReleasesRepoUrl
                credentials {
                    username = sonatypeUsername
                    password = sonatypePassword
                }
            }
        }
    }

    signing {
        if (signingKey) {
            useInMemoryPgpKeys(signingKey, signingPassword)
        }
        sign publishing.publications.d4mCommon
    }
}

